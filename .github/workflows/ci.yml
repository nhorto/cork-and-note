name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test:
    name: Lint & test
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      # The render suites pay the whole React Native module graph on their
      # first test. Cold, under a loaded runner, that first test alone can
      # exceed the per-test timeout; a warm transform cache makes it a
      # fraction of a second, so the cache is keyed on everything that
      # affects transform output.
      - name: Restore jest transform cache
        uses: actions/cache@v4
        with:
          path: .jest-cache
          key: jest-${{ runner.os }}-${{ hashFiles('package-lock.json', 'babel.config.js') }}
          restore-keys: jest-${{ runner.os }}-

      - name: Lint
        run: npx eslint . --max-warnings=-1

      - name: Test
        run: npx jest --ci

  # The edge functions are TypeScript that Jest never imports and eslint only
  # parses — nothing was typechecking them. That gap let a metered task ship
  # with no fair-use cap: `deno check` had been reporting it as an error the
  # whole time, on a machine nobody was looking at.
  deno:
    name: Typecheck edge functions
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: denoland/setup-deno@v2
        with:
          deno-version: v2.x

      - name: Type check
        working-directory: supabase/functions
        run: deno check chat/index.ts delete-account/index.ts revenuecat-webhook/index.ts places/index.ts routes/index.ts _shared/*.ts

      # Every handler runs end to end against a fake database, a fake
      # upstream and a fake clock (_shared/testing.ts). --allow-run and
      # --allow-read are for the CORS suite, which re-imports the module in a
      # subprocess per allow-list configuration.
      - name: Test
        working-directory: supabase/functions
        run: deno test --allow-env --allow-run --allow-read
